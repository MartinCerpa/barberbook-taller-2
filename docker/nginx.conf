server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://nagerholidays.com; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'" always;
  location /api/ { proxy_pass http://api:3003; proxy_set_header Host $http_host; }
  location / { try_files $uri $uri/ /index.html; }
}
